<!-- LEADERBOARD SIDEBAR (Collapsible) -->
<div x-data="{ showLeaderboard: false, leaders: [] }" x-init="
        // Fetch leaderboard on load
        fetch('/api/games/trader/leaderboard')
            .then(r => r.json())
            .then(data => leaders = data)
            .catch(err => console.error('Leaderboard fetch error:', err));
        
        // Refresh every 30 seconds
        setInterval(() => {
            fetch('/api/games/trader/leaderboard')
                .then(r => r.json())
                .then(data => leaders = data)
                .catch(err => console.error('Leaderboard refresh error:', err));
        }, 30000);
     "
    class="fixed right-0 top-12 h-[calc(100vh-3rem)] w-80 bg-[#1e2329] border-l border-[#2b3139] transform transition-transform duration-300 z-50"
    :class="showLeaderboard ? 'translate-x-0' : 'translate-x-full'">

    <!-- Toggle Button -->
    <button @click="showLeaderboard = !showLeaderboard"
        class="absolute left-0 top-20 -translate-x-full bg-[#f0b90b] px-2 py-4 rounded-l text-2xl hover:bg-[#d9a009] transition-colors">
        🏆
    </button>

    <!-- Leaderboard Content -->
    <div class="p-4 h-full overflow-y-auto">
        <div class="flex items-center justify-between mb-4">
            <h3 class="text-lg font-bold text-white">🏆 Leaderboard</h3>
            <span class="text-xs text-slate-500">Live</span>
        </div>

        <template x-if="leaders.length === 0">
            <div class="text-center text-slate-500 py-8">
                <div class="text-4xl mb-2">📊</div>
                <div class="text-sm">No traders yet!</div>
            </div>
        </template>

        <template x-for="(leader, index) in leaders" :key="leader.id">
            <div class="flex items-center gap-3 p-3 mb-2 bg-[#0b0e11] rounded border transition-all hover:border-[#f0b90b]"
                :class="index === 0 ? 'border-[#f0b90b]' : 'border-[#2b3139]'">
                <div class="text-2xl font-bold w-8" :class="{
                         'text-[#f0b90b]': index === 0,
                         'text-slate-400': index === 1,
                         'text-amber-700': index === 2,
                         'text-slate-500': index > 2
                     }" x-text="'#' + (index + 1)"></div>
                <div class="flex-1 min-w-0">
                    <div class="font-bold text-white truncate" x-text="leader.username"></div>
                    <div class="text-xs text-slate-500" x-text="leader.total_trades + ' trades'"></div>
                </div>
                <div class="text-right">
                    <div class="font-mono font-bold text-sm"
                        :class="leader.total_profit >= 0 ? 'text-emerald-400' : 'text-[#f6465d]'"
                        x-text="(leader.total_profit >= 0 ? '+' : '') + '$' + leader.total_profit.toFixed(2)"></div>
                </div>
            </div>
        </template>
    </div>
</div>
